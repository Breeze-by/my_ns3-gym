            expected_update_rate: 0.5
            marking: true
            observation_persistence: 0.0
            obstacle_max_range: 20.0
            obstacle_min_range: 0.0
            topic: /tb1/peer_footprints
          peer_clear:
            clearing: true
            data_type: LaserScan
            expected_update_rate: 0.5
            inf_is_valid: true
            marking: false
            observation_persistence: 0.0
            obstacle_max_range: 19.9
            obstacle_min_range: 0.0
            raytrace_max_range: 20.0
            raytrace_min_range: 0.0
            topic: /tb1/peer_obstacles
          plugin: nav2_costmap_2d::ObstacleLayer
        plugins:
        - voxel_layer
        - peer_layer
        - inflation_layer
        publish_frequency: 1.0
        resolution: 0.05
        robot_base_frame: base_link
        robot_radius: 0.22
        rolling_window: true
        static_layer:
          map_subscribe_transient_local: true
        update_frequency: 3.0
        use_sim_time: true
        voxel_layer:
          enabled: true
          mark_threshold: 0
          max_obstacle_height: 2.0
          observation_sources: scan
          origin_z: 0.0
          plugin: nav2_costmap_2d::VoxelLayer
          publish_voxel_map: true
          scan:
            clearing: true
            data_type: LaserScan
            marking: true
            max_obstacle_height: 2.0
            topic: /tb1/scan
          z_resolution: 0.05
          z_voxels: 16
        width: 10
    local_costmap_client:
      ros__parameters:
        use_sim_time: true
    local_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: true
