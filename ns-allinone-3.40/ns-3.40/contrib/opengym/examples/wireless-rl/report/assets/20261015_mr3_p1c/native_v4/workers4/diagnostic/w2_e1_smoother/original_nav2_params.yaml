    local_costmap:
      ros__parameters:
        always_send_full_costmap: true
        global_frame: odom
        height: 10
        inflation_layer:
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
          plugin: nav2_costmap_2d::InflationLayer
        map_topic: /tb1/map
        peer_layer:
          combination_method: 1
          enabled: true
          footprint_clearing_enabled: true
          observation_sources: peer_clear peer_body
          peer_body:
            clearing: false
